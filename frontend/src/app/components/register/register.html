<div class="auth-page">
    <p class="auth-eyebrow">{{ text.eyebrow }}</p>
    <h1 class="auth-title">{{ text.title }}</h1>
    <p class="auth-subtitle">{{ text.subtitle }}</p>

    <div class="auth-card">
        @if (errorMessage(); as error) {
        <p class="auth-error">{{ error }}</p>
        }

        <label class="field">
            <span class="field__label">{{ text.fullNameLabel }}</span>
            <input type="text" [placeholder]="text.fullNamePlaceholder" [value]="fullName()"
                (input)="updateFullName($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.emailLabel }}</span>
            <input type="email" [placeholder]="text.emailPlaceholder" [value]="email()"
                (input)="updateEmail($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.phoneLabel }}</span>
            <input type="tel" [placeholder]="text.phonePlaceholder" [value]="phone()"
                (input)="updatePhone($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.passwordLabel }}</span>
            <input type="password" [placeholder]="text.passwordPlaceholder" [value]="password()"
                (input)="updatePassword($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.confirmPasswordLabel }}</span>
            <input type="password" [placeholder]="text.confirmPasswordPlaceholder" [value]="confirmPassword()"
                (input)="updateConfirmPassword($any($event.target).value)" />
        </label>

        @if (password().length > 0 && confirmPassword().length > 0 && !passwordsMatch()) {
        <p class="field-hint field-hint--error">{{ text.passwordMismatch }}</p>
        }

        <div class="captcha-slot">
            <div #turnstileContainer></div>
        </div>

        <button class="btn" [disabled]="!canSubmit()" (click)="submit()">
            {{ isSubmitting() ? text.submitBusy : text.submitIdle }}
        </button>

        <p class="auth-footer">{{ text.footerText }}<a routerLink="/login">{{ text.footerLink }}</a></p>
    </div>
