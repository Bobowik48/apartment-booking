<div class="lightbox" role="dialog" aria-modal="true" (click)="close()">
    <button type="button" class="lightbox__close" (click)="close()" aria-label="Zamknij">&times;</button>

    <button type="button" class="lightbox__arrow lightbox__arrow--prev" (click)="previous(); $event.stopPropagation()"
        aria-label="Poprzednie zdjęcie">&#8249;</button>

    <img class="lightbox__image" [src]="currentUrl()" alt="" (click)="$event.stopPropagation()" />

    <button type="button" class="lightbox__arrow lightbox__arrow--next" (click)="next(); $event.stopPropagation()"
        aria-label="Następne zdjęcie">&#8250;</button>

    <p class="lightbox__counter" (click)="$event.stopPropagation()">{{ currentIndex() + 1 }} /
        {{ imageUrls().length }}</p>
</div>
