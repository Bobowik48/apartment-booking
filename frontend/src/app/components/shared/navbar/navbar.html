<nav class="navbar">
    <a routerLink="/" class="navbar__logo">{{ text.logo }}</a>

    <div class="navbar__right">
        <a routerLink="/booking" class="navbar__link">{{ text.booking }}</a>

        @if (authService.currentUser(); as user) {
        <a routerLink="/my-reservations" class="navbar__link">{{ text.myReservations }}</a>
        @if (user.role === 'ADMIN') {
        <a routerLink="/admin" class="navbar__link">{{ text.adminPanel }}</a>
        }
        <span class="navbar__divider"></span>
        <span class="navbar__email">{{ user.email }}</span>
        <button class="btn-ghost navbar__logout" (click)="logout()">{{ text.logout }}</button>
        } @else {
        <a routerLink="/login" class="navbar__link">{{ text.login }}</a>
        <a routerLink="/register" class="navbar__link">{{ text.register }}</a>
        }
    </div>
</nav>
