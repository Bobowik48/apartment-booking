<div class="auth-page">
    <p class="auth-eyebrow">{{ text.eyebrow }}</p>
    <h1 class="auth-title">{{ text.title }}</h1>
    <p class="auth-subtitle">{{ text.subtitle }}</p>

    <div class="auth-card">
        @if (errorMessage(); as error) {
        <p class="auth-error">{{ error }}</p>
        }

        <label class="field">
            <span class="field__label">{{ text.currentPasswordLabel }}</span>
            <input type="password" [value]="currentPassword()"
                (input)="updateCurrentPassword($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.newPasswordLabel }}</span>
            <input type="password" [value]="newPassword()" (input)="updateNewPassword($any($event.target).value)" />
        </label>

        <label class="field">
            <span class="field__label">{{ text.confirmPasswordLabel }}</span>
            <input type="password" [value]="confirmPassword()"
                (input)="updateConfirmPassword($any($event.target).value)" />
        </label>

        @if (newPassword().length > 0 && confirmPassword().length > 0 && !passwordsMatch()) {
        <p class="field-hint field-hint--error">{{ text.passwordMismatch }}</p>
        }

        <button class="btn" [disabled]="!canSubmit()" (click)="submit()">
            {{ isSubmitting() ? text.submitBusy : text.submitIdle }}
        </button>
    </div>
</div>
